<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA module 4 Labs</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --side: #1f2a3d;
      --side-text: #e8ecf4;
      --side-active: #2f4267;
      --text: #1d2330;
      --muted: #5b6475;
      --accent: #2563eb;
      --error: #b42318;
      --border: #d5dbe6;
      --code-bg: #eef1f7;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1420;
        --card: #171f2e;
        --side: #0a0f19;
        --side-text: #e8ecf4;
        --side-active: #1c2740;
        --text: #e8ecf4;
        --muted: #9aa5b8;
        --accent: #6ea8ff;
        --error: #ff8a80;
        --border: #2c3648;
        --code-bg: #111827;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.45;
    }
    .app {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      background: var(--side);
      color: var(--side-text);
      padding: 24px 16px;
    }
    .brand { font-size: 1.15rem; margin: 0 0 20px; }
    .navlink {
      display: block;
      color: var(--side-text);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
    }
    .navlink:hover { background: var(--side-active); }
    .navlink[aria-current="page"] { background: var(--side-active); font-weight: 600; }
    .content { padding: 24px; min-width: 0; }
    h1.page-title { font-size: 1.5rem; margin: 0 0 16px; }
    h2 { font-size: 1.2rem; margin: 0 0 8px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      min-width: 0;
    }
    .muted { color: var(--muted); margin: 0 0 12px; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    button {
      padding: 10px 14px;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: var(--error); margin: 12px 0 0; }
    .result { margin-top: 16px; }
    dl { margin: 0; }
    dl div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; }

    /* Modules page */
    .module-list { display: grid; gap: 12px; }
    .module-card { padding: 16px 20px; }
    .module-card p { margin: 0 0 10px; color: var(--muted); }
    .file-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .file-buttons button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .file-buttons button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .viewer { margin-top: 20px; }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow: auto;
      max-height: 60vh;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.85rem;
      margin: 8px 0 0;
    }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { padding: 12px 16px; }
      .brand { margin-bottom: 8px; font-size: 1rem; }
      .sidebar nav { display: flex; gap: 8px; flex-wrap: wrap; }
      .navlink { margin-bottom: 0; }
      .content { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function currentRoute() {
      return window.location.hash === "#/modules" ? "modules" : "tools";
    }

    // Shared helper: fetch JSON and turn an error response into a thrown message.
    async function getJson(url) {
      const response = await fetch(url);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    /* ---------- Weather (Optional Task 2) ---------- */
    function WeatherPanel() {
      const [place, setPlace] = useState("");
      const [weather, setWeather] = useState(null);
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      async function search(event) {
        event.preventDefault();
        const trimmed = place.trim();
        setWeather(null);
        setError("");
        if (!trimmed) {
          setError("Enter a place name.");
          return;
        }
        setLoading(true);
        try {
          setWeather(await getJson(`/api/weather?place=${encodeURIComponent(trimmed)}`));
        } catch (err) {
          setError(err.message || "Could not reach the server.");
        } finally {
          setLoading(false);
        }
      }

      return (
        <section className="card">
          <h2>Weather</h2>
          <p className="muted">Current weather for a place, from Open-Meteo.</p>
          <form onSubmit={search}>
            <input
              value={place}
              onChange={(event) => setPlace(event.target.value)}
              placeholder="e.g. London"
              aria-label="Place name"
            />
            <button type="submit" disabled={loading}>
              {loading ? "Searching..." : "Search"}
            </button>
          </form>
          {error && <p className="error" role="alert">{error}</p>}
          {weather && (
            <div className="result">
              <h2>{weather.place}</h2>
              <dl>
                <div><dt>Time</dt><dd>{weather.time}</dd></div>
                <div><dt>Temperature</dt><dd>{weather.temperature} {weather.temperature_unit}</dd></div>
                <div><dt>Humidity</dt><dd>{weather.humidity} {weather.humidity_unit}</dd></div>
                <div><dt>Wind speed</dt><dd>{weather.wind_speed} {weather.wind_speed_unit}</dd></div>
                <div><dt>Conditions</dt><dd>{weather.conditions}</dd></div>
              </dl>
            </div>
          )}
        </section>
      );
    }

    /* ---------- Postcodes (Optional Task 3) ---------- */
    function PostcodePanel() {
      const [code, setCode] = useState("");
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      async function search(event) {
        event.preventDefault();
        setResult(null);
        setError("");
        setLoading(true);
        try {
          setResult(await getJson(`/api/postcode?code=${encodeURIComponent(code)}`));
        } catch (err) {
          setError(err.message || "Could not reach the server.");
        } finally {
          setLoading(false);
        }
      }

      return (
        <section className="card">
          <h2>UK postcode</h2>
          <p className="muted">GPS coordinates, looked up offline from the ONS postcode list.</p>
          <form onSubmit={search}>
            <input
              value={code}
              onChange={(event) => setCode(event.target.value)}
              placeholder="e.g. SW1A 1AA"
              aria-label="UK postcode"
            />
            <button type="submit" disabled={loading}>
              {loading ? "Searching..." : "Find"}
            </button>
          </form>
          {error && <p className="error" role="alert">{error}</p>}
          {result && (
            <div className="result">
              <h2>{result.postcode}</h2>
              <dl>
                <div><dt>Latitude</dt><dd>{result.latitude}</dd></div>
                <div><dt>Longitude</dt><dd>{result.longitude}</dd></div>
              </dl>
            </div>
          )}
        </section>
      );
    }

    /* ---------- Modules 1-8 ---------- */
    function ModulesPage() {
      const [modules, setModules] = useState([]);
      const [loadError, setLoadError] = useState("");
      const [selected, setSelected] = useState(null); // {path, label}
      const [file, setFile] = useState(null);         // {path, content}
      const [fileError, setFileError] = useState("");

      useEffect(() => {
        getJson("/api/modules")
          .then(setModules)
          .catch((err) => setLoadError(err.message));
      }, []);

      async function openFile(item) {
        setSelected(item);
        setFile(null);
        setFileError("");
        try {
          setFile(await getJson(`/api/module-file?path=${encodeURIComponent(item.path)}`));
        } catch (err) {
          setFileError(err.message);
        }
      }

      return (
        <>
          <h1 className="page-title">Modules 1-8</h1>
          {loadError && <p className="error" role="alert">{loadError}</p>}
          <div className="module-list">
            {modules.map((module) => (
              <section className="card module-card" key={module.number}>
                <h2>Module {module.number}: {module.title}</h2>
                <p>{module.topic}</p>
                <div className="file-buttons">
                  {module.files.map((item) => (
                    <button
                      key={item.path}
                      type="button"
                      aria-pressed={selected && selected.path === item.path}
                      onClick={() => openFile(item)}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </section>
            ))}
          </div>

          {selected && (
            <section className="card viewer">
              <h2>{selected.label}</h2>
              <p className="muted">{selected.path}</p>
              {fileError && <p className="error" role="alert">{fileError}</p>}
              {!file && !fileError && <p className="muted">Loading...</p>}
              {file && <pre>{file.content}</pre>}
            </section>
          )}
        </>
      );
    }

    /* ---------- Page shell with left navigation ---------- */
    function App() {
      const [route, setRoute] = useState(currentRoute());

      useEffect(() => {
        const onChange = () => setRoute(currentRoute());
        window.addEventListener("hashchange", onChange);
        return () => window.removeEventListener("hashchange", onChange);
      }, []);

      return (
        <div className="app">
          <aside className="sidebar">
            <h1 className="brand">QA module 4 Labs</h1>
            <nav>
              <a
                className="navlink"
                href="#/tools"
                aria-current={route === "tools" ? "page" : undefined}
              >
                Weather &amp; postcodes
              </a>
              <a
                className="navlink"
                href="#/modules"
                aria-current={route === "modules" ? "page" : undefined}
              >
                Modules 1-8
              </a>
            </nav>
          </aside>
          <main className="content">
            {route === "modules" ? (
              <ModulesPage />
            ) : (
              <>
                <h1 className="page-title">Weather &amp; postcodes</h1>
                <div className="grid">
                  <WeatherPanel />
                  <PostcodePanel />
                </div>
              </>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
